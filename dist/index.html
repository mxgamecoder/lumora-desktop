<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumora Desktop</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f0f1a; color: #fafafa;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; text-align: center; padding: 24px; }
    h1 { margin: 0; font-size: 2rem; letter-spacing: .04em; }
    p { margin: 0; color: #a1a1aa; max-width: 520px; line-height: 1.55; }
    code { background: #15151f; color: #b1baf9; padding: 2px 6px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Lumora Desktop</h1>
    <p>Tauri 2 + Rust shell. This is the placeholder frontend — drop the real web build into <code>dist/</code>.</p>
  </div>
</body>
</html>
